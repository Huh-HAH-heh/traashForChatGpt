name: Build PR13 DOCX

on:
  push:
    paths:
      - "generate_pr13.py"
      - ".github/workflows/build-pr13-docx.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-docx
        run: pip install python-docx

      - name: Generate document
        run: python generate_pr13.py

      - name: Commit final document and remove generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ИС-31_Хасанов_ПЗ№17_Техническое_задание.docx"
          git rm "generate_pr13.py" ".github/workflows/build-pr13-docx.yml"
          git commit -m "fix: align PR13 technical assignment with shelter project"
          git push
