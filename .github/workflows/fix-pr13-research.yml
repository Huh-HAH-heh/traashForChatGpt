name: Fix PR13 research grounding

on:
  push:
    paths:
      - ".github/workflows/fix-pr13-research.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-docx
        run: pip install python-docx

      - name: Patch document
        run: |
          cat > patch_pr13.py <<'PY'
          from docx import Document
          from docx.shared import Pt, Cm
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.table import WD_TABLE_ALIGNMENT, WD_CELL_VERTICAL_ALIGNMENT
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          from pathlib import Path

          path = Path("ИС-31_Хасанов_ПЗ№17_Техническое_задание.docx")
          doc = Document(path)

          def font(run, size=14, bold=None):
              run.font.name = "Times New Roman"
              run.font.size = Pt(size)
              if bold is not None:
                  run.bold = bold

          def replace_after(startswith, text):
              for i, p in enumerate(doc.paragraphs):
                  if p.text.strip().startswith(startswith) and i + 1 < len(doc.paragraphs):
                      q = doc.paragraphs[i + 1]
                      q.text = text
                      for r in q.runs:
                          font(r)
                      return True
              return False

          replace_after("10. Кто является основным пользователем?", "Рабочая гипотеза целевой аудитории — взрослые пользователи Android, регулярно читающие электронные книги и использующие озвучивание текста как дополнительный способ потребления контента. Возраст 18–49 лет рассматривается как ориентир, а не как утверждённая демографическая граница: внешний источник по читательским привычкам США показывает заметное использование электронных книг и аудиокниг в группах 18–29 и 30–49 лет. Для российского рынка эти цифры напрямую не переносятся и требуют локальной проверки [6].")
          replace_after("18. Кто относится к прямым конкурентам", "В результате анализа конкурентной среды выделены пять релевантных аналогов: ReadEra, FBReader, Moon+ Reader, PocketBook Reader и Kindle. Они выбраны по принадлежности к категории мобильного чтения и по пересечению с функциями FB2 и/или TTS [1–5].")
          replace_after("19. Чем BookReader", "По результатам анализа конкурентов BookReader целесообразно отличать фокусом на базовом сценарии «найти книгу — открыть — читать или слушать», а не количеством функций. У крупных аналогов уже присутствуют расширенные библиотеки, множество форматов, темы, заметки, синхронизация и TTS [1–5]. Поэтому конкурентное отличие разумно строить вокруг простоты сценария и приоритета текста.")
          replace_after("20. Какие решения конкурентов", "При визуальном анализе аналогов повторяются понятная библиотека, читаемый экран книги и отдельные элементы управления/настроек. В качестве ориентиров берутся эти принципы, а не конкретные композиции. Одновременно видно, что часть конкурентов перегружает продукт функциями, поэтому для BookReader выбран более сдержанный сценарий [1–5].")
          replace_after("21. Какие решения нежелательны?", "Нежелательные решения сформулированы как вывод визуального аудита: визуальный шум, конкурирующие акценты и декоративность без функции ухудшают иерархию интерфейса. Это также согласуется с требованиями к читаемости и различимости действий мобильного интерфейса [1–5, 7].")
          replace_after("22. Какое визуальное направление", "После анализа пяти аналогов выбрано предварительное направление: минималистичный тёмный цифровой стиль с одним акцентным цветом. Это не утверждение о «правильном» стиле рынка, а проектный вывод из исследования: категория активно использует цветные акценты и буквальные образы книги, поэтому BookReader целесообразно сместить акцент на спокойное пространство для текста и связь чтения с озвучиванием [1–5].")
          replace_after("23. Какие цвета", "Предварительная палитра является рабочей гипотезой, выведенной из визуального аудита конкурентов и из уже существующего интерфейса BookReader. Тёмная нейтральная основа должна отличать проект от часто встречающихся ярких синих, оранжевых, красных и многоцветных иконок категории; единый синий акцент сохраняется как наследуемый элемент интерфейса. Точные значения #0F1115, #171A21, #F4F6F8, #9AA4B2 и #3498F5 не выдаются за результат исследования аудитории и подлежат проверке на контраст в прототипе [1–5, 7].")
          replace_after("24. Какие визуальные правила", "Для цифровых носителей закрепляются только правила с понятным основанием: единая иерархия текста — по принципам Material 3; умеренное скругление — в пределах типовых форм Material; высокий контраст текста и фона — как требование доступности Android [7]. Конкретные значения сетки, радиусов и толщины линий остаются рабочими параметрами и проверяются на прототипе.")
          replace_after("25. Какая типографика", "Для интерфейса предлагается Inter как рабочий кандидат, но выбор шрифта не считается окончательно доказанным результатом исследования. Обоснованный результат исследования — явная типографическая иерархия, различимая размером, насыщенностью и межстрочным интервалом, а также достаточный контраст текста [7].")
          replace_after("26. Какая графика", "Визуальный аудит показал повторяющийся буквальный код категории: открытая книга, закладка, группа книг, луна и другие прямые метафоры чтения [1–5]. Поэтому для BookReader выбран принцип отличия через переход «текст → звук»: строки текста и ритм могут преобразовываться в абстрактный звуковой сигнал. Геометрия и линейная иконография остаются проектным решением.")
          replace_after("27. Какие решения точно", "Не подходят решения, которые разрушают приоритет текста и иерархию действий: лишняя декоративность, множество равнозначных акцентов, псевдообъём и визуально разрозненные элементы. Вывод сделан из сопоставления визуальных кодов аналогов и требований к читаемости мобильного интерфейса [1–5, 7].")
          replace_after("3.3.", "Целевая аудитория — пользователи Android, регулярно читающие электронные книги и использующие синтез речи как дополнительный способ потребления текста. Возраст 18–49 лет указан как рабочая исследовательская гипотеза, а не как установленная граница; дальнейшее уточнение аудитории предполагает локальное пользовательское исследование. Пользователь ожидает быстрых действий, визуального порядка и комфортного длительного чтения [6].")
          replace_after("3.4.", "BookReader — спокойный и технологичный инструмент для тех, кто хочет хранить, читать и слушать электронные книги в одном месте. Такое позиционирование выведено из сопоставления функций и визуального языка исследованных аналогов: BookReader не конкурирует с ними количеством форматов, облачных сервисов или второстепенных функций, а концентрируется на связном сценарии чтения и прослушивания [1–5].")

          # Insert research section before 3. Техническое задание once.
          anchor = None
          for p in doc.paragraphs:
              if p.text.strip() == "3. Техническое задание":
                  anchor = p
                  break
          if anchor and not any("2.11. Исследовательское обоснование решений" in p.text for p in doc.paragraphs):
              p = anchor.insert_paragraph_before()
              p.style = doc.styles["Heading 2"]
              r = p.add_run("2.11. Исследовательское обоснование решений"); font(r, 14, True)

              p = anchor.insert_paragraph_before()
              p.style = doc.styles["Normal"]
              p.paragraph_format.line_spacing = 1.5
              p.paragraph_format.first_line_indent = Cm(1.25)
              p.paragraph_format.alignment = WD_ALIGN_PARAGRAPH.JUSTIFY
              r = p.add_run("Исследование выполнено для частей брифа, где появляются утверждения о пользователях, конкурентной среде и визуальном языке. Использованы анализ карточек приложений и их функций в Google Play и на официальном сайте FBReader, визуальный аудит значков и интерфейсных приёмов аналогов, сопоставление сценариев чтения и озвучивания, а также сверка цифровых правил с рекомендациями Android и Material 3. Это позволяет отделить фактические данные от рабочих дизайнерских гипотез.")
              font(r)

              rows = [
                ("ReadEra", "50 млн+ установок; 1,58 млн отзывов; FB2, EPUB, PDF и др.; библиотека и настройки; в актуальном описании отмечено улучшение TTS.", "Библиотека и мультформатность; буквальная книга/закладка.", "Не копировать категорийный знак; сделать акцент на связке чтение + слушание. [1]"),
                ("FBReader", "Поддерживает FB2 и другие форматы; Premium включает чтение вслух текстовых форматов; стабильная Android-версия 3.8.32 опубликована 03.08.2026.", "Функциональный ридер; прямой образ книги.", "TTS не уникален; важны простота сценария и собственный графический код. [2]"),
                ("Moon+ Reader", "10 млн+ установок; 269 тыс. отзывов; множество форматов, 10+ тем и большое число настраиваемых действий.", "Высокая насыщенность функциями; открытая книга и луна.", "Не конкурировать визуальной и функциональной перегруженностью. [3]"),
                ("PocketBook Reader", "10 млн+ установок; 102 тыс. отзывов; 26 форматов; TTS, синхронизация, облако, заметки и библиотека.", "Сильный охват: книги, облако, магазин; группа книг.", "Позиционировать BookReader как более узкий и спокойный инструмент. [4]"),
                ("Kindle", "100 млн+ установок; 4,8 млн отзывов; большой каталог, настройка текста, прогресс и сервисные функции.", "Сильный экосистемный бренд.", "Не конкурировать с экосистемой контента; строиться вокруг чтения/слушания. [5]")
              ]

              t = doc.add_table(rows=1, cols=4)
              t.alignment = WD_TABLE_ALIGNMENT.CENTER
              t.style = "Table Grid"
              for j, h in enumerate(["Аналог", "Факты исследования", "Наблюдение по визуальному коду", "Вывод для BookReader"]):
                  c=t.rows[0].cells[j]; c.text=h; c.vertical_alignment=WD_CELL_VERTICAL_ALIGNMENT.CENTER
                  shd=OxmlElement("w:shd"); shd.set(qn("w:fill"), "D9EAF7"); c._tc.get_or_add_tcPr().append(shd)
                  for pp in c.paragraphs:
                      pp.alignment=WD_ALIGN_PARAGRAPH.CENTER
                      for rr in pp.runs: font(rr,10,True)
              for row in rows:
                  cells=t.add_row().cells
                  for j, val in enumerate(row):
                      cells[j].text=val
                      for pp in cells[j].paragraphs:
                          pp.paragraph_format.line_spacing=1.0
                          for rr in pp.runs: font(rr,9.5)
              anchor._p.addprevious(t._tbl)

              for txt in [
                  "Исследование целевой аудитории. По данным Pew Research Center, опубликованным 08.04.2026, среди взрослых 18–29 лет 41% сообщили о чтении электронных книг за последние 12 месяцев и 32% — о прослушивании аудиокниг; для группы 30–49 лет показатели составили 33% и 33%. Исследование проведено в США, поэтому оно используется только как общий ориентир и не переносится напрямую на российский рынок [6].",
                  "Наблюдение по пользовательскому поведению дополнено отзывами ReadEra: пользователи описывают использование приложения и для чтения, и для прослушивания, когда заняты другими делами. Это поддерживает гипотезу о ценности быстрого переключения между чтением и TTS, но одновременно подтверждает, что сама функция TTS уже присутствует у конкурентов [1].",
                  "Исследование визуального языка. В значках и описаниях аналогов повторяются буквальные метафоры чтения: открытая книга, закладка, группа книг, а у части продуктов — дополнительные образы вроде луны [1–5]. Поэтому ограничение на клише «книга + наушники» и направление «текст → звук» являются выводом визуального анализа категории.",
                  "Исследование цифровых правил. Android рекомендует использовать явную типографическую иерархию и достаточный контраст, а Material 3 даёт системную шкалу форм и показывает связь формы с иерархией и брендингом [7]. Поэтому в ТЗ закреплены проверяемые требования к читаемости, контрасту, иерархии и последовательности форм."
              ]:
                  p=anchor.insert_paragraph_before(); p.style=doc.styles["Normal"]
                  p.paragraph_format.line_spacing=1.5; p.paragraph_format.first_line_indent=Cm(1.25); p.paragraph_format.alignment=WD_ALIGN_PARAGRAPH.JUSTIFY
                  r=p.add_run(txt); font(r)

              p=anchor.insert_paragraph_before(); p.style=doc.styles["Heading 2"]; r=p.add_run("Связь исследования с решениями брифа и ТЗ"); font(r,14,True)
              mapping=[
                ("Целевая аудитория","Внешнее исследование + анализ сценария","18–49 лет — рабочая гипотеза; акцент на совмещении чтения и слушания."),
                ("Конкуренты","Анализ пяти реальных аналогов","Зафиксированы конкуренты, насыщенность категории и отсутствие уникальности TTS."),
                ("Визуальный образ","Визуальный аудит аналогов","Отказ от клише «книга + наушники»; направление «текст → звук»."),
                ("Цвет и типографика","Визуальный аудит + Android/Material","Палитра — рабочая гипотеза; обязательны контраст и иерархия."),
                ("Позиционирование","Сопоставление функций и визуального языка","Спокойный инструмент с коротким базовым сценарием.")
              ]
              t2=doc.add_table(rows=1, cols=3); t2.alignment=WD_TABLE_ALIGNMENT.CENTER; t2.style="Table Grid"
              for j,h in enumerate(["Пункт","Основание","Итоговое решение"]):
                  c=t2.rows[0].cells[j]; c.text=h
                  shd=OxmlElement("w:shd"); shd.set(qn("w:fill"), "E6EED5"); c._tc.get_or_add_tcPr().append(shd)
                  for pp in c.paragraphs:
                      pp.alignment=WD_ALIGN_PARAGRAPH.CENTER
                      for rr in pp.runs: font(rr,10,True)
              for row in mapping:
                  cells=t2.add_row().cells
                  for j,val in enumerate(row):
                      cells[j].text=val
                      for pp in cells[j].paragraphs:
                          pp.paragraph_format.line_spacing=1.0
                          for rr in pp.runs: font(rr,9.5)
              anchor._p.addprevious(t2._tbl)

              p=anchor.insert_paragraph_before(); p.style=doc.styles["Heading 2"]; r=p.add_run("Источники исследования"); font(r,14,True)
              sources=[
                "[1] Google Play. ReadEra — читалка книг fb2 pdf epub. https://play.google.com/store/apps/details?id=org.readera (доступ: 05.10.2026).",
                "[2] FBReader. Для Android — официальная страница приложения. https://fbreader.org/ru/android (доступ: 05.10.2026).",
                "[3] Google Play. Moon+ Reader. https://play.google.com/store/apps/details?id=com.flyersoft.moonreader (доступ: 05.10.2026).",
                "[4] Google Play. PocketBook reader — EPUB, PDF. https://play.google.com/store/apps/details?id=com.obreey.reader (доступ: 05.10.2026).",
                "[5] Google Play. Amazon Kindle: Reading App. https://play.google.com/store/apps/details?id=com.amazon.kindle (доступ: 05.10.2026).",
                "[6] Pew Research Center. Book reading habits in the U.S. vary by education, age and other factors. 08.04.2026. https://www.pewresearch.org/chart/book-reading-habits-in-the-u-s-vary-by-education-age-and-other-factors/ (доступ: 05.10.2026).",
                "[7] Android Developers. Material Design 3 и Accessibility. https://developer.android.com/codelabs/m3-design-theming и https://developer.android.com/design/ui/mobile/guides/foundations/accessibility (доступ: 05.10.2026)."
              ]
              for txt in sources:
                  p=anchor.insert_paragraph_before(); p.style=doc.styles["Normal"]
                  p.paragraph_format.line_spacing=1.0; p.paragraph_format.first_line_indent=Cm(0); p.paragraph_format.alignment=WD_ALIGN_PARAGRAPH.LEFT
                  r=p.add_run(txt); font(r,10)

              p=anchor.insert_paragraph_before(); p.style=doc.styles["Normal"]
              p.paragraph_format.line_spacing=1.5; p.paragraph_format.first_line_indent=Cm(1.25); p.paragraph_format.alignment=WD_ALIGN_PARAGRAPH.JUSTIFY
              r=p.add_run("Принцип работы с отмеченными преподавателем пунктами: фактические сведения отделены от дизайнерских гипотез. Там, где ответ подтверждается внешним источником, приведено основание; там, где речь идёт о будущем графическом решении, оно обозначено как проектная гипотеза и связано с результатом анализа. Это позволяет не выдавать предположение за исследовательский факт и одновременно сохранить конкретность брифа."); font(r,14,True)

          doc.save(path)
          print("patched", path)
          PY
          python patch_pr13.py
          rm patch_pr13.py

      - name: Commit final document and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ИС-31_Хасанов_ПЗ№17_Техническое_задание.docx"
          git rm ".github/workflows/fix-pr13-research.yml"
          git commit -m "Fix PR13 research grounding"
          git push
